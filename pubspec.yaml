name: swing_plus
description: A Flutter app to track stock portfolios with dashboard, importer, and live data.
publish_to: 'none' # Remove this if you plan to publish

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 📂 File picker for broker CSV/XLSX uploads
  file_picker: ^5.2.2

  # 🌐 HTTP client for live stock/ETF/MF data
  http: ^1.2.0

  # 💾 Local database for storing imported holdings
  sqflite: ^2.3.0
  path_provider: ^2.1.0

  # 🔄 State management (optional, but recommended)
  provider: ^6.1.0

  # 📊 Charts (optional, for portfolio visualization later)
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

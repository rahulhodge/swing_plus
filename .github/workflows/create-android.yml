name: Create Android scaffolding

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  create-android:
    name: Run `flutter create .` and commit android/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Flutter (pinned)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'   # ✅ pin to a known stable release

      - name: Verify Flutter
        run: |
          echo "Flutter installation check"
          flutter --version
          which flutter

      - name: Run flutter create
        run: |
          echo "Generating missing android/ folder..."
          flutter create . --org com.swingplus.app --project-name swing_plus --platforms android

      - name: Show git status
        run: git status --porcelain

      - name: Commit and push generated android/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android
          git diff --staged --quiet || git commit -m "chore(ci): add android scaffolding via flutter create"
          git push

name: Restore Android scaffolding

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  restore-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'   # pin to a stable release

      - name: Generate android/ folder
        run: flutter create . --org com.swingplus.app --project-name swing_plus --platforms android

      - name: Commit android/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android
          git diff --staged --quiet || git commit -m "Restore Android scaffolding"
          git push

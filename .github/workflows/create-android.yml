name: Create Android scaffolding

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  create-android:
    name: Run `flutter create .` and commit android/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'

      - name: Run flutter create
        run: |
          echo "Running flutter create to generate missing platform folders (android)..."
          flutter --version
          flutter create . --org com.example --project-name swing_plus --platforms android

      - name: Show git status
        run: git status --porcelain

      - name: Commit and push generated android/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(ci): add android scaffolding via flutter create"
            git push
          fi
